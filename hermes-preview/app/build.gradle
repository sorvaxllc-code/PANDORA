plugins { id 'com.android.application' }
android {
    namespace 'com.pandora.hermespreview'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pandora.hermespreview19'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '19.0-local-preview'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
