name: PANDORA - APK otomatik derleme

on:
  push:
    branches: [main]
    paths:
      - 'PANDORA 10.zip'
      - 'PANDORA%2010.zip'
      - 'app/**'
      - 'tests/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Ilk aktarimda ZIP dosyasini kaynak koduna donustur
        id: sources
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="PANDORA 10.zip"
          [[ -f "$ARCHIVE" ]] || ARCHIVE="PANDORA%2010.zip"
          if [[ ! -f "app/build.gradle" ]] && [[ -f "$ARCHIVE" ]]; then
            mkdir -p "$RUNNER_TEMP/pandora"
            unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/pandora"
            SRC="$RUNNER_TEMP/pandora/PANDORA 10"
            test -f "$SRC/app/build.gradle"
            cp -a "$SRC/app" "$SRC/tests" .
            cp "$SRC/build.gradle" "$SRC/settings.gradle" "$SRC/gradle.properties" .
            cp "$SRC/CHANGELOG.md" "$SRC/PANDORA_MASTER_PLAN.md" "$SRC/README_TR.md" "$SRC/YENI_MODUL_NASIL_EKLENIR.md" .
            cp "$SRC/.gitignore" .
            git config user.name 'PANDORA CI'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app tests build.gradle settings.gradle gradle.properties CHANGELOG.md PANDORA_MASTER_PLAN.md README_TR.md YENI_MODUL_NASIL_EKLENIR.md .gitignore
            git commit -m 'chore: import PANDORA 10 Android source code'
            git push origin HEAD:main
          fi
          if [[ -f "app/build.gradle" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Ilk defa "PANDORA 10.zip" dosyasini depoya yukleyin; sonra bu adim kendiliginden devam eder.'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: JDK 17
        if: steps.sources.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        if: steps.sources.outputs.ready == 'true'
        uses: android-actions/setup-android@v3
      - name: Android SDK platformu
        if: steps.sources.outputs.ready == 'true'
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Gradle 9.6.1
        if: steps.sources.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
          cache-provider: basic
      - name: Saf Java testleri
        if: steps.sources.outputs.ready == 'true'
        run: bash tests/RUN_TESTS.sh
      - name: Android debug APK
        if: steps.sources.outputs.ready == 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: APK artefaktini kaydet
        if: steps.sources.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PANDORA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
