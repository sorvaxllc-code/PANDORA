name: PANDORA Integration Checks
on:
  push:
    branches: [main, codex/pandora-17, codex/pandora-hermes-final]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Prepare offline Turkish voice model
        run: python3 scripts/prepare_voice_model.py
      - name: Pure Java tests
        run: bash tests/RUN_TESTS.sh
      - name: Compile app code without releasing an APK
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: HTTP integration tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android lint (no installable APK)
        run: gradle --no-daemon :app:lintDebug
      - name: Print remaining Android lint findings if failed
        if: failure()
        run: |
          for report in \
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt \
            app/build/reports/lint-results-debug.txt; do
            if test -f "$report"; then
              cat "$report"
              break
            fi
          done
