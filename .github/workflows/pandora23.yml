name: PANDORA 23 Offline Quiet Wake APK
on:
  push:
    branches: [pandora23-quiet-offline-wake]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'
      - name: Fetch and SHA256-verify Vosk speech models
        run: python3 scripts/prepare_voice_model.py
      - name: Source unit tests
        run: bash tests/RUN_TESTS.sh
      - name: Build PANDORA 23
        run: gradle --no-daemon :app:assembleDebug
      - name: Confirm APK generated
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PANDORA-23-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14