name: PANDORA 19 Hermes Android APK
on:
  push:
    branches: [pandora19-hermes-android]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle -p hermes-preview --no-daemon :app:assembleDebug
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: PANDORA-19-Hermes-APK
          path: hermes-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
