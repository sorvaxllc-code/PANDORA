name: PANDORA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import source ZIP (one time)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f PANDORA10.zip ]]; then
            mkdir -p "$RUNNER_TEMP/pandora-src"
            unzip -q PANDORA10.zip -d "$RUNNER_TEMP/pandora-src"
            test -f "$RUNNER_TEMP/pandora-src/PANDORA 10/settings.gradle"
            cp -R "$RUNNER_TEMP/pandora-src/PANDORA 10/." .
            # Workflow files require additional permissions. Keep only the already authorized CI workflow.
            rm -f .github/workflows/apk.yml
            rm -f PANDORA10.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import PANDORA 10 Android sources"
            git push origin HEAD:main
          fi
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK (no obsolete tools package)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Source unit tests
        run: bash tests/RUN_TESTS.sh
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish unsigned-for-release test APK
        uses: actions/upload-artifact@v4
        with:
          name: PANDORA-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
