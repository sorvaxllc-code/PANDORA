plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.kisisel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.kisisel'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1.0'
        manifestPlaceholders = [pandoraAppName: 'PANDORA']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Stable signing is required to install future releases as updates.
    // Secrets must be passed from the CI environment; never commit a keystore.
    signingConfigs {
        pandoraRelease {
            def signingPath = System.getenv('PANDORA_KEYSTORE_PATH')
            if (signingPath != null && !signingPath.isEmpty()) {
                storeFile file(signingPath)
                storePassword System.getenv('PANDORA_KEYSTORE_PASSWORD')
                keyAlias 'pandora'
                keyPassword System.getenv('PANDORA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.trial11'
            manifestPlaceholders = [pandoraAppName: 'PANDORA 11']
        }
        release {
            // Separate, stable ID; old differently signed apps remain untouched.
            applicationIdSuffix '.stable'
            manifestPlaceholders = [pandoraAppName: 'PANDORA']
            minifyEnabled false
            if (System.getenv('PANDORA_KEYSTORE_PATH')) {
                signingConfig signingConfigs.pandoraRelease
            }
        }
    }
}
