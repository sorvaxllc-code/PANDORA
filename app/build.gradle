plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.kisisel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.kisisel'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '2.4.0-headset-routing'
        manifestPlaceholders = [pandoraAppName: 'PANDORA']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Stable signing is required to install future releases as updates.
    // Secrets must be passed from the CI environment; never commit a keystore.
    signingConfigs {
        pandoraRelease {
            def signingPath = System.getenv('PANDORA_KEYSTORE_PATH')
            if (signingPath != null && !signingPath.isEmpty()) {
                storeFile file(signingPath)
                storePassword System.getenv('PANDORA_KEYSTORE_PASSWORD')
                keyAlias 'pandora'
                keyPassword System.getenv('PANDORA_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.trial24'
            manifestPlaceholders = [pandoraAppName: 'PANDORA 24']
        }
        release {
            // Separate, stable ID; old differently signed apps remain untouched.
            applicationIdSuffix '.stable'
            manifestPlaceholders = [pandoraAppName: 'PANDORA']
            minifyEnabled false
            if (System.getenv('PANDORA_KEYSTORE_PATH')) {
                signingConfig signingConfigs.pandoraRelease
            }
        }
    }
}

// Bundled OCR model: works on-device without a separate server/API key.
// ML Kit OCR is distinct from the AI model used to summarize text.
dependencies {
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
